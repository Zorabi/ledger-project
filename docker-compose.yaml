services:
  postgres:
    image: postgres:16-alpine
    container_name: ledger-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456
      POSTGRES_DB: ledger
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ledger"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    container_name: ledger-backend
    build:
      context: ./backend
    restart: always
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_POSTGRES_HOST: postgres
      DATABASE_POSTGRES_PORT: 5432
      DATABASE_POSTGRES_USER: postgres
      DATABASE_POSTGRES_PASSWORD: 123456
      DATABASE_POSTGRES_DBNAME: ledger
      DATABASE_POSTGRES_SSL_MODE: disable
      DATABASE_POSTGRES_AUTO_CREATE: "true"
      DATABASE_POSTGRES_AUTO_MIGRATE: "true"

  frontend:
    container_name: ledger-frontend
    build:
      context: ./frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres-data:
